<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaso Collection — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{font-family:Cairo,sans-serif;background:#f5eee4;color:#382617;padding:20px}
.panel{background:#fffaf4;border:1px solid #e4d2b8;border-radius:25px;padding:25px;max-width:600px;margin:auto;box-shadow:0 10px 30px #65481e14}
h1{color:#a87325;text-align:center;margin-bottom:25px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;padding:12px;border:1px solid #d9c5a7;border-radius:12px;margin-bottom:20px;font-family:inherit}
button{width:100%;background:#a87325;color:white;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:18px;cursor:pointer}
button:disabled{opacity:.6}
#msg{text-align:center;font-weight:bold;margin-top:15px;line-height:1.8}
a{display:block;text-align:center;margin-top:20px;color:#a87325}
.fileBox{
border:2px dashed #d9c5a7;
border-radius:15px;
padding:18px;
text-align:center;
margin-bottom:20px;
cursor:pointer;
background:#fffdf9;
color:#8a642e
}
.fileBox input{display:none}
#preview{
display:none;
width:150px;
height:150px;
object-fit:cover;
border-radius:15px;
margin:0 auto 20px;
border:1px solid #e4d2b8
}

/* قائمة المنتجات */
.productsAdmin{
margin-top:30px;
border-top:1px solid #e4d2b8;
padding-top:25px
}

.productsAdmin h2{
color:#a87325;
text-align:center;
margin-bottom:20px
}

.adminProduct{
display:flex;
align-items:center;
gap:12px;
padding:12px;
margin-bottom:12px;
background:#fff;
border:1px solid #e4d2b8;
border-radius:15px
}

.adminProduct img{
width:70px;
height:70px;
object-fit:cover;
border-radius:12px;
flex-shrink:0
}

.adminInfo{
flex:1;
min-width:0
}

.adminInfo b{
display:block;
font-size:15px;
margin-bottom:4px;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

.adminPrice{
color:#a87325;
font-weight:700
}

.deleteBtn{
width:auto;
padding:9px 12px;
background:#9a5147;
font-size:14px;
border-radius:10px;
flex-shrink:0
}

.deleteBtn:hover{
background:#7e3e36
}

.noProducts{
text-align:center;
color:#967e62;
padding:25px
}
</style>
</head>

<body>

<div class="panel">

<h1>إدارة المنتجات</h1>

<label>اسم المنتج</label>
<input type="text" id="pName" placeholder="مثال: فستان">

<label>السعر (دج)</label>
<input type="number" id="pPrix" placeholder="3500" min="0">

<label>صورة المنتج</label>

<label class="fileBox">
📷 اضغطي هنا لاختيار صورة من معرض الهاتف
<input type="file" id="pFile" accept="image/*">
</label>

<img id="preview">

<button id="publishBtn" onclick="addProduct()">
نشر المنتج ✦
</button>

<div id="msg"></div>


<!-- المنتجات المنشورة -->

<div class="productsAdmin">

<h2>المنتجات المنشورة 🛍️</h2>

<div id="adminProducts">
جاري تحميل المنتجات...
</div>

</div>


<a href="index.html">العودة للموقع</a>

</div>


<script>

const SUPABASE_URL =
"https://xfioqgckubqmhmjdewda.supabase.co";

const SUPABASE_KEY =
"sb_publishable_ixEiPYOG9BPb9tUM1Eplcw_q1so-64v";

const SCHEMA = "public";

const TABLE = "yaso.collection";

const API =
`${SUPABASE_URL}/rest/v1/${TABLE}`;

let selectedImage = "";


/* =========================
اختيار الصورة
========================= */

document.getElementById("pFile").addEventListener("change",function(){

const file = this.files[0];

if(!file) return;

if(!file.type.startsWith("image/")){

showMsg("اختاري ملف صورة فقط.","red");

return;

}

const reader = new FileReader();

reader.onload=function(e){

selectedImage=e.target.result;

const preview=document.getElementById("preview");

preview.src=selectedImage;

preview.style.display="block";

showMsg("تم اختيار الصورة ✓","green");

};

reader.readAsDataURL(file);

});


/* =========================
ضغط الصورة
========================= */

function compressImage(dataURL){

return new Promise((resolve)=>{

const img=new Image();

img.onload=function(){

const MAX=1200;

let width=img.width;
let height=img.height;

if(width>MAX || height>MAX){

if(width>height){

height=Math.round(height*MAX/width);
width=MAX;

}else{

width=Math.round(width*MAX/height);
height=MAX;

}

}

const canvas=document.createElement("canvas");

canvas.width=width;
canvas.height=height;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,width,height);

resolve(
canvas.toDataURL("image/jpeg",0.82)
);

};

img.src=dataURL;

});

}


/* =========================
نشر المنتج
========================= */

async function addProduct(){

const name =
document.getElementById("pName").value.trim();

const prix =
document.getElementById("pPrix").value;

const button =
document.getElementById("publishBtn");


if(!name || !prix || !selectedImage){

showMsg(
"املئي الاسم والسعر واختاري صورة المنتج.",
"red"
);

return;

}

button.disabled=true;
button.innerText="جاري نشر المنتج...";


try{

const image_url =
await compressImage(selectedImage);


const res=await fetch(API,{

method:"POST",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Content-Type":
"application/json",

"Accept":
"application/json",

"Accept-Profile":
SCHEMA,

"Content-Profile":
SCHEMA,

"Prefer":
"return=representation"

},

body:JSON.stringify([{

name:name,

prix:Number(prix),

image_url:image_url

}])

});


const responseText=await res.text();


if(!res.ok){

throw new Error(responseText);

}


showMsg(
"تم نشر المنتج بنجاح! ✨",
"green"
);


document.getElementById("pName").value="";
document.getElementById("pPrix").value="";
document.getElementById("pFile").value="";

selectedImage="";

document.getElementById("preview").style.display="none";


/* تحديث قائمة المنتجات */

loadAdminProducts();


}catch(err){

console.error(err);

showMsg(
"لم يتم نشر المنتج ❌<br>"+err.message,
"red"
);

}finally{

button.disabled=false;
button.innerText="نشر المنتج ✦";

}

}


/* =========================
عرض المنتجات في لوحة التحكم
========================= */

async function loadAdminProducts(){

const box=document.getElementById("adminProducts");

try{

const res=await fetch(
`${API}?select=name,prix,image_url`,
{
method:"GET",
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Accept":"application/json",
"Accept-Profile":SCHEMA
}
}
);

if(!res.ok){

throw new Error(await res.text());

}

const data=await res.json();


if(!data.length){

box.innerHTML=
`<div class="noProducts">
لا توجد منتجات حالياً ♡
</div>`;

return;

}


box.innerHTML=data.map((p,index)=>`

<div class="adminProduct">

<img
src="${escapeAttr(p.image_url)}"
alt="${escapeAttr(p.name)}"
onerror="this.src='https://placehold.co/100x100/f1e5d5/98713b?text=YS'"
>

<div class="adminInfo">

<b>
${escapeHTML(p.name || "منتج Yaso")}
</b>

<div class="adminPrice">
${Number(p.prix || 0).toLocaleString("fr-DZ")} دج
</div>

</div>

<button
class="deleteBtn"
onclick="deleteProduct(${index})"
>
🗑️ حذف
</button>

</div>

`).join("");


/*
نحفظ القائمة الحالية حتى نعرف
أي منتج تم اختياره للحذف.
*/

window.adminProducts=data;


}catch(err){

console.error(err);

box.innerHTML=
`<div class="noProducts" style="color:#a55">
تعذر تحميل المنتجات.
</div>`;

}

}


/* =========================
حذف منتج
========================= */

async function deleteProduct(index){

const data=window.adminProducts || [];

const product=data[index];

if(!product) return;


const confirmed=confirm(
`هل تريدين حذف المنتج:

${product.name}

نهائياً؟`
);

if(!confirmed) return;


try{

const deleteURL =
`${API}?name=eq.${encodeURIComponent(product.name)}`;


const res=await fetch(deleteURL,{

method:"DELETE",

headers:{

"apikey":SUPABASE_KEY,

"Authorization":
"Bearer "+SUPABASE_KEY,

"Accept":"application/json",

"Accept-Profile":SCHEMA,

"Prefer":"return=minimal"

}

});


if(!res.ok){

throw new Error(await res.text());

}


showMsg(
"تم حذف المنتج بنجاح 🗑️",
"green"
);


loadAdminProducts();


}catch(err){

console.error(err);

showMsg(
"لم يتم حذف المنتج ❌<br>"+err.message,
"red"
);

}

}


/* =========================
الرسائل
========================= */

function showMsg(text,color){

const msg=document.getElementById("msg");

msg.style.color=color;

msg.innerHTML=text;

}


/* =========================
حماية النص
========================= */

function escapeHTML(v){

return String(v ?? "")
.replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"

}[m])
);

}

function escapeAttr(v){

return escapeHTML(v);

}


/* تشغيل لوحة التحكم */

loadAdminProducts();

</script>

</body>
</html>
