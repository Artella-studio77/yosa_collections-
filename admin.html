<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yaso Collection — لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:Cairo,sans-serif;background:#f5eee4;color:#382617;padding:20px}
.panel{background:#fffaf4;border:1px solid #e4d2b8;border-radius:25px;padding:25px;max-width:600px;margin:auto;box-shadow:0 10px 30px #65481e14}
h1{color:#a87325;text-align:center;margin-bottom:25px}
label{display:block;font-weight:700;margin-bottom:8px}
input{width:100%;padding:12px;border:1px solid #d9c5a7;border-radius:12px;margin-bottom:20px;font-family:inherit}
button{width:100%;background:#a87325;color:white;border:0;border-radius:12px;padding:15px;font-weight:700;font-size:18px;cursor:pointer}
#msg{text-align:center;font-weight:bold;margin-top:15px}
a{display:block;text-align:center;margin-top:20px;color:#a87325}
</style>
</head>
<body>
<div class="panel">
  <h1>إدارة المنتجات</h1>
  <label>اسم المنتج</label>
  <input type="text" id="pName" placeholder="مثال: فستان">
  <label>السعر (دج)</label>
  <input type="number" id="pPrix" placeholder="3500">
  <label>رابط الصورة</label>
  <input type="url" id="pImg" placeholder="https://...">
  <button onclick="addProduct()">نشر المنتج ✦</button>
  <div id="msg"></div>
  <a href="index.html">العودة للموقع</a>
</div>

<script>
const SUPABASE_URL = "https://xfioqgckubqmhmjdewda.supabase.co";
const SUPABASE_KEY = "sb_publishable_ixEiPYOG9BPb9tUM1Eplcw_q1so-64v";
const SCHEMA = "yaso";
const TABLE = "collection";

async function addProduct() {
  const name = document.getElementById('pName').value;
  const prix = document.getElementById('pPrix').value;
  const image_url = document.getElementById('pImg').value;
  const msg = document.getElementById('msg');

  if(!name || !prix || !image_url) {
    msg.style.color = "red"; msg.innerText = "املأ جميع الحقول!"; return;
  }

  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}`, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Accept-Profile": SCHEMA,
        "Content-Profile": SCHEMA
      },
      body: JSON.stringify([{ name: name, prix: Number(prix), image_url: image_url }])
    });

    if (!res.ok) throw new Error(await res.text());

    msg.style.color = "green";
    msg.innerText = "تم النشر بنجاح! ✨";
  } catch (err) {
    msg.style.color = "red";
    msg.innerText = "خطأ: " + err.message;
  }
}
</script>
</body>
</html>
